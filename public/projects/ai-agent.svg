<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#061627;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad1)"/>
  <rect width="800" height="450" fill="url(#grad2)"/>
  
  <!-- AI Brain/Network nodes -->
  <circle cx="200" cy="200" r="40" fill="#00FFFF" opacity="0.3" stroke="#00FFFF" stroke-width="2"/>
  <circle cx="400" cy="150" r="50" fill="#00FFFF" opacity="0.4" stroke="#00FFFF" stroke-width="3"/>
  <circle cx="600" cy="200" r="40" fill="#00FFFF" opacity="0.3" stroke="#00FFFF" stroke-width="2"/>
  <circle cx="300" cy="300" r="35" fill="#00FFFF" opacity="0.3" stroke="#00FFFF" stroke-width="2"/>
  <circle cx="500" cy="300" r="35" fill="#00FFFF" opacity="0.3" stroke="#00FFFF" stroke-width="2"/>
  
  <!-- Connection lines -->
  <line x1="200" y1="200" x2="400" y2="150" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="150" x2="600" y2="200" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="200" x2="300" y2="300" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="200" x2="500" y2="300" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  <line x1="300" y1="300" x2="500" y2="300" stroke="#00FFFF" stroke-width="2" opacity="0.4"/>
  
  <!-- Center AI symbol -->
  <path d="M 400 150 L 420 180 L 450 170 L 430 200 L 400 200 L 370 200 L 350 170 L 380 180 Z" 
        fill="#00FFFF" opacity="0.6"/>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="32" fill="#00FFFF" 
        text-anchor="middle" font-weight="bold">AI Agent</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="16" fill="#88CCCC" 
        text-anchor="middle">Intelligent Automation System</text>
</svg>
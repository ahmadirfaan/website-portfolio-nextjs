<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A192F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#061627;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#grad1)"/>
  <rect width="800" height="450" fill="url(#grad2)"/>
  
  <!-- Movie frames -->
  <rect x="100" y="100" width="150" height="200" fill="#1E3A5F" stroke="#00FFFF" stroke-width="2" opacity="0.6" rx="5"/>
  <rect x="100" y="100" width="150" height="120" fill="#2A4A6F" opacity="0.8"/>
  <rect x="325" y="100" width="150" height="200" fill="#1E3A5F" stroke="#00FFFF" stroke-width="2" opacity="0.6" rx="5"/>
  <rect x="325" y="100" width="150" height="120" fill="#2A4A6F" opacity="0.8"/>
  <rect x="550" y="100" width="150" height="200" fill="#1E3A5F" stroke="#00FFFF" stroke-width="2" opacity="0.6" rx="5"/>
  <rect x="550" y="100" width="150" height="120" fill="#2A4A6F" opacity="0.8"/>
  
  <!-- Play button -->
  <circle cx="400" cy="225" r="30" fill="#00FFFF" opacity="0.8"/>
  <polygon points="390,215 390,235 410,225" fill="#0A192F"/>
  
  <!-- Chat bubble -->
  <rect x="200" y="320" width="200" height="80" fill="#1E3A5F" stroke="#00FFFF" stroke-width="2" rx="10" opacity="0.7"/>
  <text x="300" y="360" font-family="Arial, sans-serif" font-size="14" fill="#00FFFF" text-anchor="middle">Live Chat</text>
  
  <!-- Title -->
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="32" fill="#00FFFF" 
        text-anchor="middle" font-weight="bold">Rent Movie App</text>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="16" fill="#88CCCC" 
        text-anchor="middle">Stream &amp; Chat Platform</text>
</svg>